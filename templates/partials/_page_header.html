{% load static %}
<header class="page-header {% if bg or header_photo %}has-photo{% endif %}">
  {% if bg or header_photo %}<div class="page-header-bg" style="background-image:url('{% firstof bg header_photo %}')" aria-hidden="true"></div>{% endif %}
  <img class="hero-mark" src="{% static 'img/logo-mark-white.png' %}" alt="">
  <div class="container position-relative" style="z-index:2">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'core:home' %}">Home</a></li>
        {% if parent_label %}<li class="breadcrumb-item"><a href="{{ parent_url }}">{{ parent_label }}</a></li>{% endif %}
        <li class="breadcrumb-item active" aria-current="page">{{ title }}</li>
      </ol>
    </nav>
    <h1 class="split-in">{{ title }}</h1>
    {% if subtitle %}<p>{{ subtitle }}</p>{% endif %}
  </div>
  {% include "partials/_cradle.html" %}
</header>
