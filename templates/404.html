{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block content %}
<section class="section"><div class="container text-center" style="max-width:640px">
  <h1>We couldn't find that page</h1>
  <p class="lead">It may have moved. Try the home page or search for what you need.</p>
  <form action="{% url 'core:search' %}" class="d-flex gap-2 my-4"><input name="q" class="form-control" placeholder="Search the site" aria-label="Search"><button class="btn btn-primary">Search</button></form>
  <a href="{% url 'core:home' %}" class="btn btn-quiet">Go to the home page</a>
</div></section>
{% endblock %}
