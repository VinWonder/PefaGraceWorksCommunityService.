# Production-style stack: PostgreSQL + Django (Gunicorn) + Nginx
#   docker compose up -d --build
#   docker compose exec web python manage.py migrate
#   docker compose exec web python manage.py seed_pgcs
#   docker compose exec web python manage.py createsuperuser
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pgcs_db
      POSTGRES_USER: pgcs_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgcs_user -d pgcs_db"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://pgcs_user:${POSTGRES_PASSWORD:-change-this-db-password}@db:5432/pgcs_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/app/media:ro
    depends_on:
      - web

volumes:
  pgdata:
  media:
